# pc-tidy settings
#
# pc-tidy copies settings.template.ini to settings.ini the first time it runs. Change settings.ini,
# not the template: updating pc-tidy replaces the template, never your settings.ini.
#
#   python pc_tidy.py settings edit    opens settings.ini in Notepad, and checks it when you close Notepad
#   python pc_tidy.py settings check   lists every mistake, with its line number
#   python pc_tidy.py settings show    shows every value and where it came from
#
# How to write it:
# - One "key = value" per line. A list has one item per line, indented under its key.
# - A line that starts with # or ; is a comment.
# - After yes/no, a number or one of a few fixed words, a # starts a comment:  temp_files = no  # later
#   Paths, lists, patterns and text keep a #, because a folder may be called "C# projects".
#   Put comments about those on a line of their own.
# - %USERPROFILE% and the other %NAME% environment variables are filled in. Write %% for a % sign.
# - A backslash is just a backslash: C:\new is the folder C:\new.
# - Delete a line to use its default. An option on the command line wins over this file.
# - A mistake stops only the tools that read its section: a typo in [cleanup] never stops the weekly sort.


[report]
# disk_report.py: what the report shows.

# folders smaller than this (in GB) are left out of the folder tree
min_gb = 1.0
# how many levels deep the folder tree goes
max_depth = 8
# how many of the biggest files are listed
top_files = 20
# the smallest cleanable item (in GB) listed under "Things you can clean up"
cleanup_min_gb = 0.1
# how much of C: should be free: the report says which fixes get it there
target_free_percent = 15


[ai]
# The local AI (Ollama), used by tidy_folder.py and disk_report.py. It sorts and describes, and
# never decides what is deleted.

# yes = use it when Ollama is running, no = never (as with --no-llm)
enabled = yes
# any model you downloaded with "ollama pull", for example a bigger one like qwen2.5:7b
model = llama3.2:3b
# where Ollama listens. Only this PC is allowed (localhost, 127.0.0.1 or [::1]), so nothing leaves it
url = http://localhost:11434
# how long to wait for one answer, in seconds
timeout_seconds = 180
# at most this many unknown folders are described in the report
max_folders = 15
# at most this many unrecognized apps are sorted into types in the report
max_apps = 60


[cleanup]
# What .\cleanup.ps1 cleans. Run .\cleanup.ps1 -DryRun first: it shows what would go, and changes nothing.
#
# yes = clean it, no = skip it

# conda package cache ("conda clean --all"). Needs conda in the window
conda_cache = yes
# pip download cache
pip_cache = yes
# uv download cache
uv_cache = yes
# NVIDIA / AMD / DirectX shader caches. They rebuild themselves
gpu_shader_cache = yes
# your Temp folder and C:\Windows\Temp. Files in use are skipped
temp_files = yes
# empty the Recycle Bin on every drive
recycle_bin = yes
# crash dump files (*.dmp) left by Windows and apps
crash_dumps = yes
# turn off hibernation (and Fast Startup). Frees C:\hiberfil.sys
hibernation = no
# installer files (.exe .msi .msix ...) in installer_folders. Check the dry-run list: a portable
# app that runs straight from its .exe would be deleted too
installers = yes
# only installers older than this many days, so one you just downloaded survives
installers_min_age_days = 7

# folders to delete installers from (top level only, subfolders are left alone).
# Sorted\To-Delete is where tidy_folder.py puts installers.
installer_folders =
    %USERPROFILE%\Downloads
    %USERPROFILE%\Sorted\To-Delete

# conda environments to delete, one name per line
conda_envs_to_remove =

# apps to uninstall, one per line: the exact names from Settings > Apps or from the disk report
apps_to_uninstall =

# any other files or folders to delete, one per line. Wildcards (*) are allowed, for example
#     D:\old-backups\*.zip
# Drive roots, Windows, Program Files, AppData and your Windows user folders are refused.
extra_paths_to_delete =


[move]
# move_off_c.py

# the smallest folder or file (in GB) worth offering. --min-gb wins over it
min_gb = 1.0
# things go to <the other drive>\<this folder> unless you give --to
dest_folder_name = From-C


[tidy]
# tidy_folder.py, and the weekly sort

# the folder to sort. --source wins over it
source = %USERPROFILE%\Downloads
# where the sorted folders go. --dest (or --in-place) wins over it
dest = %USERPROFILE%\Sorted
# files older than this many days go under <dest>\Archive\<folder>. 0 = never
archive_after_days = 60
# files changed in the last this many minutes are left alone (they may still be downloading)
skip_newer_than_min = 10
# yes = the AI also gives the files it sorts a clearer name
rename_with_ai = yes
# the folders the AI chooses from, for PDFs, Word documents, unknown types and whole folders.
# To-Delete can't be one of them: cleanup deletes installers there.
categories =
    Coursework
    Research papers
    Projects and code
    Admin and receipts
    Work
    Personal
    Software
    Other


[tidy.extensions]
# extension = folder, for files sorted by rule. Anything not listed here goes to the AI.
# installers (cleanup.ps1 deletes them, setting: Installers)
.exe = To-Delete
.msi = To-Delete
.msix = To-Delete
# images
.jpg = Pictures
.jpeg = Pictures
.png = Pictures
.gif = Pictures
.webp = Pictures
.heic = Pictures
.bmp = Pictures
.svg = Pictures
# video and audio
.mp4 = Videos
.mov = Videos
.mkv = Videos
.avi = Videos
.mp3 = Music
.wav = Music
.flac = Music
.m4a = Music
# compressed
.zip = Archives
.rar = Archives
.7z = Archives
.tar = Archives
.gz = Archives
# code and data
.py = Code
.ipynb = Code
.m = Code
.c = Code
.cpp = Code
.h = Code
.js = Code
.csv = Data
.json = Data
.mat = Data
.xlsx = Data
.xls = Data
# slides and 3D
.pptx = Slides
.ppt = Slides
.stl = 3D models
.step = 3D models
.stp = 3D models
.blend = 3D models


# ------------------------------------------------------------------------------------------------
# Your own rules for the disk report. They replace editing classify.py.
#
# Each rule is a section of its own: [label.<any name>], [category.<any name>] or
# [apptype.<any name>]. Your rules are checked before the built-in ones, in the order they appear
# here, so they can also change a built-in answer.
#
# A pattern is a regular expression on the path in lower case with forward slashes, for example
# c:/users/me/appdata/local/temp. ^ is the start and $ the end of the path.
#
# A label and advice for a folder in the report. kind = clean lists it under "Things you can clean
# up", kind = info under "Good to know". expand = yes also shows its subfolders in the folder tree.
# A label only describes a folder: pc-tidy never cleans it for you.
#
# [label.old-games]
# pattern = ^[a-z]:/games/old$
# what = Old game installers
# todo = Delete the ones you have finished
# kind = clean
#
# The category a folder counts as in "Where the space goes": System, Apps & app data, Games,
# Dev & science tools, Caches & temp, Personal files or Other.
#
# [category.lab-data]
# pattern = ^d:/lab$
# category = Personal files
#
# The type of installed apps, by keywords in "name | publisher" (in lower case): Dev & science
# tools, Games, Browsers, Communication, Office & productivity, Media & creative, Cloud & sync,
# Security & VPN, System, drivers & runtimes, Utilities or Other.
#
# [apptype.cad]
# match = onshape|rhino
# type = Dev & science tools
