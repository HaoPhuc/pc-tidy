# Every mistake M3's loader must catch, each in the section it belongs to (test_settings.py adds a BOM).
[report]
max_depth = 5
max_depth = 6

[cleanup]
temp_files = no  # later
pip_cahce = no
extra_paths_to_delete =
    D:\*
installer_folders =
    D:\C# projects\installers
    D:\Setups #old

[tidy]
dest = C:\new
source = %NOPE%\Downloads
categories =
    Work
    To-Delete

[ai]
url = http://192.168.1.20:11434

[move]
min_gb = 2

[move]
min_gb = 3

[label.games]
pattern = ^[a-z]:/games/(old|new)=1$
what = Games: old = done

[category.lab]
pattern = ^d:/lab(
category = Lab stuff
