name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Test
        # the runner is elevated, so the VHDX test volumes must be created, not skipped
        env:
          PCTIDY_REQUIRE_VOLUMES: "1"
        run: python -m pytest -q
      - name: Detach leftover test volumes
        if: always()
        shell: powershell
        run: |
          Get-ChildItem "$env:TEMP\pytest-of-*" -Recurse -Filter 'pctidy-test-*.vhdx' -ErrorAction SilentlyContinue |
            ForEach-Object { Dismount-DiskImage -ImagePath $_.FullName -ErrorAction SilentlyContinue | Out-Null }

  pester:
    name: Pester (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.999 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -MinimumVersion 5.5.0
          Invoke-Pester tests\ps -CI

  exe:
    name: pc-tidy.exe (build, test, release on a v* tag)
    runs-on: windows-latest
    permissions:
      contents: write        # only used to publish a release from a v* tag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        # a venv with PyInstaller alone, so no third-party package can end up inside the exe
        shell: powershell
        run: |
          python -m venv build-venv
          build-venv\Scripts\python.exe -m pip install --disable-pip-version-check -r packaging\requirements-build.txt
          build-venv\Scripts\python.exe -m PyInstaller --noconfirm --clean packaging\pc-tidy.spec
          $hash = (Get-FileHash dist\pc-tidy.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  pc-tidy.exe" | Out-File -Encoding ascii dist\pc-tidy.exe.sha256
          Get-Content dist\pc-tidy.exe.sha256
      - name: Test the exe
        env:
          PCTIDY_EXE: dist\pc-tidy.exe
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q tests/test_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: pc-tidy-exe
          path: |
            dist/pc-tidy.exe
            dist/pc-tidy.exe.sha256
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/pc-tidy.exe dist/pc-tidy.exe.sha256 --title "pc-tidy ${{ github.ref_name }}" --generate-notes

  setup:
    name: setup.cmd on a clean runner (twice)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: First run
        shell: cmd
        run: setup.cmd -NonInteractive
      - name: Second run (safe to run again)
        shell: cmd
        run: setup.cmd -NonInteractive
      - name: Self-test with the .venv it made
        run: .venv\Scripts\python.exe pc_tidy.py selftest
