name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Test
        # the runner is elevated, so the VHDX test volumes must be created, not skipped
        env:
          PCTIDY_REQUIRE_VOLUMES: "1"
        run: python -m pytest -q
      - name: Detach leftover test volumes
        if: always()
        shell: powershell
        run: |
          Get-ChildItem "$env:TEMP\pytest-of-*" -Recurse -Filter 'pctidy-test-*.vhdx' -ErrorAction SilentlyContinue |
            ForEach-Object { Dismount-DiskImage -ImagePath $_.FullName -ErrorAction SilentlyContinue | Out-Null }

  pester:
    name: Pester (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.999 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -MinimumVersion 5.5.0
          Invoke-Pester tests\ps -CI
